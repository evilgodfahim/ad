name: Parse Opinion to XML

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 鈫� KEY FIX: default token is read-only without this

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parse HTML to XML
        run: python parse_to_xml.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add articles.xml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update articles XML $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push